schema: spec-driven

# Project context
# NOTE: `sdd-job` holds the shared, job-agnostic standards. Each job repo fills in its own
# local docs/data-model.md (its config + persisted-state schema) and its own README; this
# block references the shared sources instead of duplicating content here.
context: |
  Project specs (single source of truth): All artifact creation and implementation MUST follow
  the project's technical context in docs/ and ai-specs/. Read and apply these when creating or
  implementing:
  - docs/base-standards.md — core principles, TDD, language standards, python-job architecture, links
  - docs/job-standards.md — CLI/actions, config, logging, run modes, signals, state/persistence, testing, security
  - docs/infrastructure-standards.md — deployment (systemd/cron/containers), log rotation, secrets
  - docs/data-model.md — this job's configuration and persisted-state schema (local per job)
  - docs/documentation-standards.md — docs structure and maintenance
  For implementation: adopt the job-developer agent from ai-specs/agents/job-developer.md. Use
  ai-specs/skills/ for workflow guidance when applicable.

# Per-artifact rules.
# NOTE: openspec 1.5.0 keys rules by artifact id (proposal/design/specs/tasks) — there is no
# `_global` bucket. The "read base-standards + job-standards first" rule is repeated per artifact.
rules:
  proposal:
    - Read and apply docs/base-standards.md and docs/job-standards.md before writing.
    - Frame Why/What/Impact around the python-job architecture (CLI/actions, config, run modes, state); list capabilities as behavior contracts.
  design:
    - Read docs/base-standards.md and docs/job-standards.md; adopt guidelines from ai-specs/agents/job-developer.md.
    - Justify decisions against job-standards rules (decision/execution separation, state mutated only on executed result, every declared flag honoured, secrets via environment only).
  specs:
    - Read docs/base-standards.md and docs/job-standards.md; use docs/data-model.md for configuration/persisted-state consistency.
    - Write testable SHALL/MUST requirements, each with at least one WHEN/THEN scenario.
  tasks:
    - Read docs/base-standards.md and docs/openspec-tasks-mandatory-steps.md.
    - Include the mandatory steps in order: feature branch (Step 0), failing test first (TDD), unit tests + persisted-state verification, manual --dry-run/one-shot verification, docs update.
